[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpcr-ligand-activity-prediction"
version = "0.1.0"
description = "GPCR agonist/antagonist prediction using ligand fingerprints, protein language model embeddings, and structural features."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
